<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تواصل معنا عبر واتساب</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #075e54, #128c7e);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: white;
      text-align: center;
    }

    .landing {
      background: white;
      color: #333;
      padding: 50px 25px;
      border-radius: 20px;
      max-width: 550px;
      width: 100%;
      box-shadow: 0 10px 40px #0003;
    }

    .icon {
      font-size: 65px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 15px;
      color: #075e54;
    }

    p {
      font-size: 17px;
      line-height: 1.9;
      margin-bottom: 30px;
      color: #666;
    }

    .whatsapp-btn {
      display: inline-block;
      background: #25d366;
      color: white;
      text-decoration: none;
      padding: 16px 35px;
      border-radius: 50px;
      font-size: 19px;
      font-weight: bold;
      transition: 0.3s;
    }

    .whatsapp-btn:hover {
      background: #128c7e;
      transform: scale(1.05);
    }

    footer {
      margin-top: 30px;
      font-size: 13px;
      color: #999;
    }
  </style>
</head>

<body>

  <div class="landing">

    <div class="icon">💬</div>

    <h1>أهلاً بك!</h1>

    <p>
      يسعدنا تواصلك معنا.
      اضغط على زر واتساب الآن وسنكون سعداء بالرد على استفساراتك.
    </p>

    <!-- ضع رقم واتساب الخاص بك هنا -->
    <a
      class="whatsapp-btn"
      href="https://wa.me/01019173933"
      target="_blank"
      rel="noopener noreferrer">
      💚 تواصل معنا عبر واتساب
    </a>

    <footer>
      جميع الحقوق محفوظة © 2026
    </footer>

  </div>

</body>
</html>
